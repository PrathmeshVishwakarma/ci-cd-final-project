apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: oc-pipelines
  labels:
    app.kubernetes.io/part-of: oc-pipelines
spec:
  description: >-
    Clean the workspace, clone the repository, lint, test, build the image,
    and deploy the counter service to OpenShift.
  params:
    - name: repo-url
      description: Git repository to clone.
      type: string
    - name: revision
      description: Git revision to build.
      type: string
      default: main
    - name: image
      description: Fully qualified image to build and deploy.
      type: string
    - name: namespace
      description: OpenShift project for the deployment.
      type: string
      default: sn-labs-prathmeshvi1
    - name: deployment-name
      description: Deployment to update.
      type: string
      default: counter-service-green
  workspaces:
    - name: pipeline-workspace
      description: Shared workspace used by every task.
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
        kind: Task
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: git-clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: pipeline-workspace

    - name: flake8
      runAfter:
        - git-clone
      taskRef:
        name: flake8
        kind: Task
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: nose
      runAfter:
        - flake8
      taskRef:
        name: nose
        kind: Task
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: buildah
      runAfter:
        - nose
      taskRef:
        name: buildah
        kind: Task
      params:
        - name: image
          value: $(params.image)
        - name: namespace
          value: $(params.namespace)
        - name: app-name
          value: counter-service
        - name: context
          value: .
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: deploy
      runAfter:
        - buildah
      taskRef:
        name: deploy
        kind: Task
      params:
        - name: image
          value: $(params.image)
        - name: namespace
          value: $(params.namespace)
        - name: deployment-name
          value: $(params.deployment-name)
      workspaces:
        - name: source
          workspace: pipeline-workspace
