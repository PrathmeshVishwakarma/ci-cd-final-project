apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
  labels:
    app.kubernetes.io/part-of: oc-pipelines
spec:
  description: Remove stale files from the shared workspace before cloning.
  workspaces:
    - name: source
      description: Workspace shared by all pipeline tasks.
  steps:
    - name: cleanup
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -eu
        workspace="$(workspaces.source.path)"
        echo "Cleaning workspace: ${workspace}"
        find "${workspace}" -mindepth 1 -maxdepth 1 \
          ! -name lost+found -exec rm -rf {} +
        echo "Workspace cleaned."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
  labels:
    app.kubernetes.io/part-of: oc-pipelines
spec:
  description: Lint the Python application with flake8.
  workspaces:
    - name: source
      description: Workspace containing the cloned repository.
  params:
    - name: image
      type: string
      default: python:3.9-slim
    - name: requirements-file
      type: string
      default: requirements.txt
  steps:
    - name: flake8
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        export HOME=/tmp
        export PIP_CACHE_DIR=/tmp/pip-cache
        export PYTHONPATH=/tmp/deps
        python -m pip install --quiet --no-cache-dir \
          --target=/tmp/deps -r "$(params.requirements-file)"
        python -m flake8 app.py tests --count --statistics
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
  labels:
    app.kubernetes.io/part-of: oc-pipelines
spec:
  description: Run the Python unit tests with nose.
  workspaces:
    - name: source
      description: Workspace containing the cloned repository.
  params:
    - name: image
      type: string
      default: python:3.9-slim
    - name: requirements-file
      type: string
      default: requirements.txt
  steps:
    - name: nose
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        export HOME=/tmp
        export PIP_CACHE_DIR=/tmp/pip-cache
        export PYTHONPATH=/tmp/deps
        export PATH="/tmp/deps/bin:${PATH}"
        python -m pip install --quiet --no-cache-dir \
          --target=/tmp/deps -r "$(params.requirements-file)"
        nosetests -v tests
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah
  labels:
    app.kubernetes.io/part-of: oc-pipelines
spec:
  description: >-
    Build the application image. The step keeps the buildah name required by the
    assignment, but uses an OpenShift source-to-image BuildConfig so the build
    works on lab clusters that do not allow the privileged SCC.
  workspaces:
    - name: source
      description: Workspace containing the cloned repository.
  params:
    - name: image
      description: Fully qualified output image tag.
      type: string
    - name: namespace
      description: OpenShift project that owns the BuildConfig.
      type: string
      default: sn-labs-prathmeshvi1
    - name: app-name
      description: BuildConfig and ImageStream name.
      type: string
      default: counter-service
    - name: context
      description: Build context directory.
      type: string
      default: .
    - name: builder-image
      description: Optional S2I builder ImageStreamTag override.
      type: string
      default: ""
  steps:
    - name: build
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        NAMESPACE="$(params.namespace)"
        APP="$(params.app-name)"
        CONTEXT="$(params.context)"
        IMAGE="$(params.image)"

        OVERRIDE_BUILDER="$(params.builder-image)"
        BUILDERS=(
          "${OVERRIDE_BUILDER}"
          "openshift/python:3.9-ubi8"
          "openshift/python:3.9"
          "openshift/python:3.8-ubi8"
          "openshift/python:3.8"
        )

        SELECTED=""
        for BUILDER in "${BUILDERS[@]}"; do
          if [ -z "${BUILDER}" ]; then
            continue
          fi
          BUILDER_NS="${BUILDER%%/*}"
          BUILDER_TAG="${BUILDER#*/}"
          if oc get imagestreamtag "${BUILDER_TAG}" -n "${BUILDER_NS}" \
              >/dev/null 2>&1; then
            SELECTED="${BUILDER}"
            break
          fi
        done

        if [ -z "${SELECTED}" ]; then
          echo "No Python S2I builder ImageStreamTag found in the openshift namespace." >&2
          exit 1
        fi

        if ! oc get buildconfig "${APP}" -n "${NAMESPACE}" >/dev/null 2>&1; then
          echo "Creating BuildConfig ${APP} from ${SELECTED}"
          oc new-build --name="${APP}" \
            --strategy=source \
            --image-stream="${SELECTED}" \
            --binary \
            --to="${APP}:latest" \
            -n "${NAMESPACE}"
        fi

        echo "Starting build ${APP} from ${CONTEXT}"
        oc start-build "${APP}" \
          --from-dir="${CONTEXT}" \
          --follow \
          -n "${NAMESPACE}"

        oc get imagestreamtag "${APP}:latest" -n "${NAMESPACE}"
        echo "Built image: ${IMAGE}"
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
  labels:
    app.kubernetes.io/part-of: oc-pipelines
spec:
  description: Apply the OpenShift manifests and roll out the new image.
  workspaces:
    - name: source
      description: Workspace containing the cloned repository.
  params:
    - name: image
      description: Image to deploy.
      type: string
    - name: namespace
      description: OpenShift project where the application is deployed.
      type: string
      default: sn-labs-prathmeshvi1
    - name: deployment-name
      description: Deployment to update.
      type: string
      default: counter-service-green
    - name: container-name
      description: Container name inside the deployment.
      type: string
      default: counter-service
    - name: manifests-dir
      description: Directory that contains the OpenShift manifests.
      type: string
      default: manifests
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        NAMESPACE="$(params.namespace)"
        IMAGE="$(params.image)"
        DEPLOYMENT="$(params.deployment-name)"
        CONTAINER="$(params.container-name)"
        MANIFESTS="$(params.manifests-dir)"

        oc apply -n "${NAMESPACE}" -f "${MANIFESTS}/deployment.yaml"
        oc set image "deployment/${DEPLOYMENT}" \
          "${CONTAINER}=${IMAGE}" -n "${NAMESPACE}"
        oc apply -n "${NAMESPACE}" -f "${MANIFESTS}/service.yaml"
        oc apply -n "${NAMESPACE}" -f "${MANIFESTS}/route.yaml"
        oc rollout status "deployment/${DEPLOYMENT}" \
          -n "${NAMESPACE}" --timeout=180s
