apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: oc-pipelines-oc-final
  labels:
    app.kubernetes.io/part-of: oc-pipelines
spec:
  pipelineRef:
    name: oc-pipelines
  serviceAccountName: default
  podTemplate:
    securityContext:
      runAsUser: 1001520000
  timeouts:
    pipeline: 1h0m0s
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: oc-lab-pvc
  params:
    - name: repo-url
      value: https://github.com/PrathmeshVishwakarma/ci-cd-final-project.git
    - name: revision
      value: main
    - name: image
      value: image-registry.openshift-image-registry.svc:5000/sn-labs-prathmeshvi1/cicd-app:latest
    - name: namespace
      value: sn-labs-prathmeshvi1
    - name: deployment-name
      value: cicd-app
