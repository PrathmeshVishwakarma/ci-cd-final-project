apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-app
  labels:
    app: cicd-app
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-app
      version: green
  template:
    metadata:
      labels:
        app: cicd-app
        version: green
    spec:
      containers:
        - name: cicd-app
          image: image-registry.openshift-image-registry.svc:5000/sn-labs-prathmeshvi1/cicd-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: APP_MODULE
              value: "app:app"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
