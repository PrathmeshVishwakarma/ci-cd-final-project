apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cicd-app
  labels:
    app: cicd-app
    version: green
spec:
  to:
    kind: Service
    name: cicd-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
