apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: counter-service-green
  labels:
    app: counter-service
    version: green
spec:
  to:
    kind: Service
    name: counter-service-green
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
